<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatolia Academic: Comprehensive Research Portal on Turkey</title>
  <meta name="description" content="Peer-reviewed trilingual interdisciplinary research portal on the Republic of Turkey covering history, international relations, constitution, state system, armed forces, economy, financial system, demography, and energy.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/infographics.css">
</head>
<body>

  <!-- Seljuk Geometric Top Frieze -->
  <div class="seljuk-geometric-frieze" aria-hidden="true"></div>

  <div id="app-container">
    <!-- Collapsible Sidebar Navigation with Turkish Aesthetic -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-wrapper">
          <div class="brand-logo-icon" title="Seljuk Eight-Pointed Star">✦</div>
          <div>
            <h1 class="brand-title" id="ui-brand-title">Anatolia Academic</h1>
            <p class="brand-subtitle" id="ui-brand-subtitle">Turkish Studies Portal</p>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav-scroll" id="sidebar-nav-list" aria-label="Research Modules Navigation">
        <!-- Dynamically populated by js/app.js -->
      </nav>

      <div class="sidebar-footer">
        <span id="ui-version-footer">v2.5 &bull; Trilingual Peer-Reviewed</span>
        <span>2026</span>
      </div>
    </aside>

    <!-- Main Content Shell -->
    <div class="app-main">
      <!-- Top Application Header with Trilingual Switcher -->
      <header class="top-header">
        <div class="header-left-group">
          <button class="icon-button mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle navigation menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>

          <!-- Global Semantic Search Bar -->
          <div class="header-search-wrap">
            <div class="search-input-box">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="global-search-input" class="search-input" placeholder="Search modules, treaties, institutions..." autocomplete="off">
              <span class="search-shortcut">/</span>
            </div>
            <!-- Live Search Dropdown -->
            <div class="search-results-dropdown" id="search-results-dropdown"></div>
          </div>
        </div>

        <div class="header-actions">
          <!-- Trilingual Language Switcher (EN, TR, RU) -->
          <div class="language-switch-group" role="group" aria-label="Language Selector">
            <button class="lang-btn active" data-lang="en" title="English Version">EN</button>
            <button class="lang-btn" data-lang="tr" title="Türkçe Versiyon">TR</button>
            <button class="lang-btn" data-lang="ru" title="Русская версия">RU</button>
          </div>

          <!-- Citation Registry Shortcut -->
          <a href="#master-bibliography" class="btn btn-secondary btn-xs" id="ui-btn-citations" style="display: flex; align-items: center; gap: 0.35rem;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span id="ui-citations-text">Citations Registry</span>
          </a>

          <!-- Dark/Light Theme Toggle -->
          <button class="icon-button" id="theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Dark or Light theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>
      </header>

      <!-- Main Scholarly Viewport -->
      <main class="content-viewport" id="main-content-viewport" tabindex="-1">
        <!-- Rendered dynamically by js/app.js -->
      </main>
    </div>
  </div>

  <!-- Interactive Citation & BibTeX Modal -->
  <div class="modal-backdrop" id="citation-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-dialog">
      <button class="modal-close-btn" aria-label="Close citation details dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div class="modal-content-inner" id="citation-modal-content">
        <!-- Populated dynamically by CitationsEngine -->
      </div>
    </div>
  </div>

  <!-- Multilingual Locale Scripts -->
  <script src="js/locales/ui_translations.js"></script>
  <script src="js/locales/data_en.js"></script>
  <script src="js/locales/data_tr.js"></script>
  <script src="js/locales/data_ru.js"></script>

  <!-- Core Scripts -->
  <script src="js/data.js"></script>
  <script src="js/citations.js"></script>
  <script src="js/visualizations.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
